{% extends "project/layout.html" %}

{% block tab_content %}
<div x-data="statsController()">
    <div class="card" style="margin-bottom: 1.5rem;">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 1rem;">翻譯統計</h3>
            <button class="btn btn-small btn-secondary" @click="load()" :disabled="loading"
                    style="padding: 0.25rem 0.75rem; font-size: 0.8rem;">重新整理</button>
        </div>
        <div class="card-body">
            <div x-show="error" class="alert alert-error" style="margin-bottom: 0;"><span x-text="error"></span></div>
            <template x-if="stats && !error">
                <div>
                    <p class="text-muted" style="margin: 0;">
                        資料來源：專案的事件紀錄（log/events.jsonl），只含代碼、次數與耗時，不含書籍文字。
                        <span x-text="'共 ' + stats.records + ' 筆紀錄'"></span><span x-show="stats.skipped_lines > 0"
                              x-text="'，略過 ' + stats.skipped_lines + ' 行無法解析的紀錄'"></span>。
                    </p>
                </div>
            </template>
        </div>
    </div>

    <template x-if="stats && !error && stats.records === 0">
        <div class="card">
            <div class="card-body empty-state" style="padding: 2rem;">
                <p x-show="!stats.exists">此專案還沒有事件紀錄：開始翻譯或提取術語後才會產生。</p>
                <p x-show="stats.exists">事件紀錄中沒有可統計的紀錄。</p>
            </div>
        </div>
    </template>

    <template x-if="stats && !error && stats.records > 0">
        <div>
            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card-header"><h3 style="margin: 0; font-size: 1rem;">依後端／模型／推理強度</h3></div>
                <div class="card-body" style="padding: 0; overflow-x: auto;">
                    <table class="export-file-table stats-table">
                        <thead>
                            <tr>
                                <th>用途</th><th>後端</th><th>模型</th><th>推理強度</th><th>模型呼叫</th>
                                <th>段落</th><th>首次即通過</th><th>需多次呼叫</th><th>其中分割</th>
                                <th>最終失敗</th><th>有回覆的呼叫</th><th>回覆耗時中位數</th><th>回覆耗時 p90</th><th>逾時</th>
                                <th>輸入 tokens</th><th>輸出 tokens</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="g in stats.models" :key="g.work + '/' + g.backend + '/' + g.model + '/' + g.effort">
                                <tr>
                                    <td x-text="g.work === 'extraction' ? '術語提取' : '翻譯'"></td>
                                    <td x-text="g.backend"></td>
                                    <td x-text="g.model"></td>
                                    <td x-text="g.effort || '-'"></td>
                                    <td :title="outcomes(g.outcomes)" x-text="g.calls"></td>
                                    <td x-text="g.segments"></td>
                                    <td x-text="count(g.first_attempt, g.first_attempt_share)"></td>
                                    <td x-text="count(g.more_calls, g.more_calls_share)"></td>
                                    <td x-text="g.split"></td>
                                    <td x-text="count(g.failed, g.failed_share)"></td>
                                    <td x-text="g.seconds_calls"></td>
                                    <td x-text="secs(g.seconds_median)"></td>
                                    <td x-text="secs(g.seconds_p90)"></td>
                                    <td x-text="g.timeouts"></td>
                                    <td x-text="g.tokens_in === null ? '未回報' : g.tokens_in"></td>
                                    <td x-text="g.tokens_out === null ? '未回報' : g.tokens_out"></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <p class="text-muted" style="margin: 0.75rem 1rem; font-size: 0.85rem;">
                        段落依其最後一次模型呼叫歸類；耗時中位數與 p90 只算有回覆的呼叫（accepted、rejected、truncated），不含暫停時取消的、很快失敗的與逾時的呼叫；「需多次呼叫」是翻譯成功但用了一次以上的呼叫（退回後重試、逾時後重試、分割），「其中分割」是其中經過分割的段落。claude-cli 不回報 tokens。
                        各呼叫結果（滑鼠移到「模型呼叫」上可看）：
                    </p>
                    <ul class="text-muted" style="margin: 0 1rem 0.75rem; font-size: 0.85rem;">
                        <template x-for="g in stats.models" :key="'o' + g.work + '/' + g.backend + '/' + g.model + '/' + g.effort">
                            <li x-text="(g.work === 'extraction' ? '術語提取：' : '翻譯：') + g.backend + ' / ' + g.model + (g.effort ? ' / ' + g.effort : '') + '：' + outcomes(g.outcomes)"></li>
                        </template>
                    </ul>
                </div>
            </div>

            <div class="card" style="margin-bottom: 1.5rem;">
                <div class="card-header"><h3 style="margin: 0; font-size: 1rem;">問題代碼（依次數）</h3></div>
                <div class="card-body" style="padding: 0;">
                    <table class="export-file-table stats-table">
                        <thead><tr><th>類別</th><th>代碼</th><th>次數</th></tr></thead>
                        <tbody>
                            <template x-for="row in issueRows()" :key="row.group + row.code">
                                <tr><td x-text="row.group"></td><td x-text="row.code"></td><td x-text="row.n"></td></tr>
                            </template>
                            <tr x-show="issueRows().length === 0"><td colspan="3" class="text-muted">沒有問題代碼</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><h3 style="margin: 0; font-size: 1rem;">執行紀錄</h3></div>
                <div class="card-body" style="padding: 0; overflow-x: auto;">
                    <table class="export-file-table stats-table">
                        <thead>
                            <tr>
                                <th>開始</th><th>結束</th><th>耗時</th><th>來源</th><th>狀態</th>
                                <th>已翻譯</th><th>失敗</th><th>捨棄</th><th>暫停</th><th>模型呼叫</th><th>執行 ID</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="r in stats.runs" :key="r.run">
                                <tr>
                                    <td x-text="r.start ? time(r.start) : '（開始不在所選紀錄中）'"></td>
                                    <td x-text="r.end ? time(r.end) : '-'"></td>
                                    <td x-text="secs(r.duration)"></td>
                                    <td x-text="sources[r.source] || r.source"></td>
                                    <td x-text="(states[r.state] || r.state) + (r.error ? '（' + r.error + '）' : '')"></td>
                                    <td x-text="r.translated"></td>
                                    <td x-text="r.failed"></td>
                                    <td x-text="r.dropped"></td>
                                    <td x-text="r.pauses"></td>
                                    <td x-text="r.calls"></td>
                                    <td><code x-text="r.run"></code></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </template>
</div>

<script>
function statsController() {
    return {
        stats: null,
        error: null,
        loading: false,
        sources: { web: '網頁翻譯', cli: 'CLI 翻譯', retranslate: '單段重翻', extract: '術語提取' },
        states: { completed: '完成', stopped: '停止', failed: '失敗', interrupted: '中斷',
                  unfinished: '未結束' },

        init() {
            this.load();
        },

        async load() {
            this.loading = true;
            try {
                const res = await fetch('/api/projects/{{ project_name }}/stats');
                const data = await res.json();
                if (!res.ok) {
                    this.error = data.error || '無法讀取統計';
                } else {
                    this.error = null;
                    this.stats = data;
                }
            } catch (e) {
                this.error = '無法讀取統計：' + e.message;
            } finally {
                this.loading = false;
            }
        },

        issueRows() {
            if (!this.stats) return [];
            const rows = [];
            const groups = [['回覆被退回', this.stats.rejected_issues],
                            ['段落最終失敗', this.stats.failure_issues],
                            ['已翻譯段落的警告', this.stats.warnings]];
            for (const [group, counts] of groups) {
                // most frequent first, equal counts by code (as the CLI report)
                for (const [code, n] of this.byCount(counts)) rows.push({ group, code, n });
            }
            return rows;
        },

        byCount(counts) {
            // JSON object keys arrive sorted by name, not by count
            return Object.entries(counts).sort((a, b) => b[1] - a[1] || (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
        },

        outcomes(counts) {
            return this.byCount(counts).map(([k, n]) => k + ' ' + n).join('、');
        },

        count(n, share) {
            return share === null ? String(n) : n + '（' + (share * 100).toFixed(1) + '%）';
        },

        secs(value) {
            return value === null ? '-' : value.toFixed(1) + ' 秒';
        },

        time(ts) {
            const d = new Date(ts);
            return d.toLocaleDateString('zh-TW') + ' ' + d.toLocaleTimeString('zh-TW', { hour12: false });
        },
    };
}
</script>
{% endblock %}
