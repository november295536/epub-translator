{% extends "project/layout.html" %}

{% block tab_content %}
<div x-data="translationController()" x-init="init()">
    <!-- Control Panel -->
    <div class="card" style="margin-bottom: 1.5rem;">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 1rem;">翻譯控制</h3>
            <div class="header-actions">
                <template x-if="state === 'idle' || state === 'completed' || state === 'failed' || state === 'stopped'">
                    <button class="btn btn-primary" @click="startTranslation()" :disabled="starting">
                        <template x-if="starting">
                            <span class="spinner"></span>
                        </template>
                        開始翻譯
                    </button>
                </template>
                <button class="btn btn-secondary" @click="startTranslation(true)" :disabled="starting"
                        x-show="failedCount > 0 && (state === 'idle' || state === 'completed' || state === 'failed' || state === 'stopped')"
                        x-text="'重試失敗段落（' + failedCount + '）'">重試失敗段落（{{ progress.failed }}）</button>
                <template x-if="state === 'running' || (state === 'paused' && autoResume)">
                    <button class="btn btn-secondary" @click="pauseTranslation('pause')">
                        ⏸ 暫停
                    </button>
                </template>
                <template x-if="state === 'paused'">
                    <button class="btn btn-success" @click="pauseTranslation('resume')">
                        ▶ 繼續翻譯
                    </button>
                </template>
            </div>
        </div>
        <div class="card-body">
            <!-- Model selector -->
            <div style="margin-bottom: 1rem; display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center;">
                <div>
                    <label for="model-select" style="font-weight: 600; margin-right: 0.5rem;">翻譯模型</label>
                    <select id="model-select"
                            :disabled="modelLoading"
                            @change="setModel($event.target.value)"
                            style="padding: 0.4rem 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem;">
                        <template x-for="m in availableModels" :key="m.key">
                            <option :value="m.key" :selected="m.key === modelKey()"
                                    x-text="m.backend + '：' + m.label + ' — ' + m.description"></option>
                        </template>
                    </select>
                    <span x-show="modelLoading" class="spinner" style="margin-left: 0.5rem;"></span>
                </div>
                <div>
                    <label for="workers-select" style="font-weight: 600; margin-right: 0.5rem;">並行 Workers</label>
                    <select id="workers-select" x-model="workers"
                            :disabled="state === 'running'"
                            style="padding: 0.4rem 0.6rem; border: 1px solid #ddd; border-radius: 4px; font-size: 0.9rem;">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="6">6</option>
                        <option value="8">8</option>
                        <option value="10">10</option>
                        <option value="12">12</option>
                        <option value="16">16</option>
                        <option value="20">20</option>
                    </select>
                    <span x-show="state === 'running' && activeWorkers > 0" class="text-muted"
                          style="margin-left: 0.5rem;"
                          x-text="activeWorkers + ' 個活躍中'"></span>
                </div>
            </div>

            <!-- Status indicator -->
            <div class="translation-status-row">
                <span class="translation-state-badge" :class="'state-' + state" x-text="stateLabel()"></span>
                <span class="text-muted" x-show="total > 0" x-text="completed + ' / ' + total + ' 段落'"></span>
            </div>

            <!-- Progress bar -->
            <div x-show="total > 0" style="margin-top: 1rem;">
                <div class="progress-bar" style="height: 28px;">
                    <div class="progress-fill" :style="'width: ' + percent + '%'"></div>
                    <span class="progress-text" x-text="percent + '%'"></span>
                </div>
            </div>

            <!-- Current segment -->
            <div x-show="currentSegment" style="margin-top: 1rem;" class="current-segment-box">
                <div class="current-segment-label">正在翻譯</div>
                <div class="current-segment-id" x-text="currentSegment"></div>
            </div>

            <!-- Error message -->
            <div x-show="error" class="alert alert-error" style="margin-top: 1rem; margin-bottom: 0;">
                <span x-text="error"></span>
            </div>

            <!-- Completed message -->
            <div x-show="state === 'completed'" class="alert" style="margin-top: 1rem; margin-bottom: 0; background: #d4edda; color: #155724; border: 1px solid #c3e6cb;">
                翻譯完成！共翻譯 <span x-text="completed"></span> 個段落。
            </div>
        </div>
    </div>

    <!-- Translation Log -->
    <div class="card">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0; font-size: 1rem;">翻譯紀錄</h3>
            <span class="text-muted" x-text="logs.length + ' 筆'"></span>
        </div>
        <div class="card-body" style="padding: 0;">
            <div x-show="logs.length === 0" class="empty-state" style="padding: 2rem;">
                <p>尚無翻譯紀錄</p>
            </div>
            <div class="translation-log" x-show="logs.length > 0">
                <template x-for="log in logs.slice().reverse()" :key="log.id">
                    <div class="log-entry" :class="log.type === 'error' ? 'log-error' : ''">
                        <div class="log-entry-header">
                            <span class="log-segment-id" x-text="log.segmentId"></span>
                            <template x-if="log.model">
                                <span class="log-model-badge" x-text="log.model" style="font-size: 0.75rem; padding: 0.1rem 0.4rem; background: #e8e8e8; border-radius: 3px; color: #555;"></span>
                            </template>
                            <span class="log-type-badge" :class="'log-type-' + log.type"
                                  x-text="log.type === 'error' ? '失敗' : '完成'"></span>
                        </div>
                        <div class="log-entry-text" x-text="log.text"></div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>

<script>
function translationController() {
    return {
        state: 'idle',
        total: 0,
        completed: 0,
        percent: 0,
        currentSegment: null,
        error: null,
        starting: false,
        logs: [],
        eventSource: null,
        logCounter: 0,
        model: '',
        backend: '',
        failedCount: {{ progress.failed }},
        availableModels: [],
        modelLoading: false,
        workers: 1,
        activeWorkers: 0,
        _pauseInFlight: false,
        autoResume: false,  // paused by a rate limit, resumes by itself

        init() {
            this.fetchModel();
            this.fetchStatus();
        },

        stateLabel() {
            const labels = {
                'idle': '閒置',
                'pending': '準備中',
                'running': '翻譯中',
                'paused': '已暫停',
                'completed': '已完成',
                'failed': '失敗',
                'stopped': '已停止',
            };
            return labels[this.state] || this.state;
        },

        async fetchModel() {
            try {
                const res = await fetch('/api/projects/{{ project_name }}/model');
                const data = await res.json();
                this.model = data.current;
                this.backend = data.backend;
                // Every backend's models; the project's backend first
                const lists = (data.backends || []).filter(b => b.name !== data.backend);
                lists.unshift({ name: data.backend, models: data.available });
                this.availableModels = lists.flatMap(b => b.models.map(m => ({
                    ...m, backend: b.name, key: b.name + '/' + m.alias })));
                // A stored model the backend does not list: shown as it is,
                // changed only when another one is picked
                if (!this.availableModels.some(m => m.key === this.modelKey())) {
                    this.availableModels = [{ alias: this.model, label: this.model, description: '目前設定，後端未列出',
                                              backend: this.backend, key: this.modelKey() },
                                            ...this.availableModels];
                }
            } catch (e) {
                console.error('Failed to fetch model:', e);
            }
        },

        modelKey() {
            return this.backend + '/' + this.model;
        },

        async setModel(key) {
            const previous = this.modelKey();
            const chosen = this.availableModels.find(m => m.key === key);
            if (!chosen) return;
            const alias = chosen.alias;
            this.modelLoading = true;
            let data = {};
            let ok = false;
            try {
                const res = await fetch('/api/projects/{{ project_name }}/model', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ model: alias, backend: chosen.backend }),
                });
                data = await res.json();
                ok = res.ok && data.status === 'ok';
            } catch (e) {
                data = { error: '模型設定失敗: ' + e.message };
            }
            if (ok) {
                this.model = data.model;
                this.backend = data.backend;
            } else {
                // Not saved: show the stored model again
                document.getElementById('model-select').value = previous;
                this.error = data.error || '模型設定失敗';
            }
            this.modelLoading = false;
        },

        async refreshFailedCount() {
            try {
                const res = await fetch('/api/projects/{{ project_name }}/progress');
                const data = await res.json();
                if (res.ok) {
                    this.failedCount = data.failed;
                    // The page header's bar was rendered when the page loaded
                    const header = document.querySelector('.project-header .progress-bar');
                    if (header) {
                        header.querySelector('.progress-fill').style.width = data.percent + '%';
                        header.querySelector('.progress-text').textContent =
                            `${data.translated + data.reviewed}/${data.total} (${data.percent}%)`;
                    }
                }
            } catch (e) {
                console.error('Failed to fetch progress:', e);
            }
        },

        async fetchStatus() {
            try {
                const res = await fetch('/api/projects/{{ project_name }}/translate/status');
                const data = await res.json();
                this.state = data.state;
                this.total = data.total;
                this.completed = data.completed;
                this.percent = data.percent || 0;
                this.currentSegment = data.current_segment;
                this.error = data.error;
                if (data.workers) this.workers = data.workers;
                if (data.active_workers !== undefined) this.activeWorkers = data.active_workers;
                this.autoResume = !!data.auto_resume;

                if (this.state === 'running' || this.state === 'paused') {
                    this.connectSSE();
                } else if (['completed', 'failed', 'stopped'].includes(this.state)) {
                    this.refreshFailedCount();  // a run that ended since the page was rendered
                }
            } catch (e) {
                console.error('Failed to fetch status:', e);
            }
        },

        async startTranslation(retryFailed = false) {
            this.starting = true;
            this.error = null;
            this.autoResume = false;  // a new run: no wait
            this.logs = [];
            try {
                const res = await fetch('/api/projects/{{ project_name }}/translate/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ workers: parseInt(this.workers), retry_failed: retryFailed }),
                });
                const data = await res.json();
                if (data.error) {
                    this.error = data.error;
                    this.starting = false;
                    return;
                }
                this.state = data.state;
                this.total = data.total;
                this.completed = 0;
                this.percent = 0;

                if (this.state === 'completed') {
                    this.starting = false;
                    this.refreshFailedCount();
                    return;
                }

                this.connectSSE();
                this.starting = false;
            } catch (e) {
                this.error = '啟動翻譯失敗: ' + e.message;
                this.starting = false;
            }
        },

        async pauseTranslation(action) {
            if (this._pauseInFlight) return;
            this._pauseInFlight = true;
            try {
                const body = { action: action };
                if (action === 'resume') body.workers = parseInt(this.workers);
                const res = await fetch('/api/projects/{{ project_name }}/translate/pause', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (data.state) {
                    this.state = data.state;
                    this.autoResume = false;  // a user pause lasts; a resume ends any wait
                    if (data.state === 'running') this.error = null;  // the pause's reason is over
                }
                if (data.error) {
                    this.error = data.error;
                }
            } catch (e) {
                this.error = '操作失敗: ' + e.message;
            } finally {
                this._pauseInFlight = false;
            }
        },

        connectSSE() {
            if (this.eventSource) {
                this.eventSource.close();
            }

            this.eventSource = new EventSource('/api/projects/{{ project_name }}/translate/stream');
            this._isFirstStatus = true;

            this.eventSource.addEventListener('status', (e) => {
                const data = JSON.parse(e.data);
                // Ended before this stream opened: no closing event follows
                const ended = this._isFirstStatus && ['completed', 'failed', 'stopped'].includes(data.state);
                if (this._isFirstStatus) {
                    this.state = data.state;
                    if (data.error) this.error = data.error;
                    if (data.resume_in != null) {  // a rate limit before this stream opened
                        this.autoResume = true;
                        this.error = (data.error || 'API 使用量已達上限') +
                            `（${Math.round(data.resume_in)} 秒後自動繼續）`;
                    }
                    this._isFirstStatus = false;
                }
                this.completed = data.completed;
                this.total = data.total;
                if (this.total > 0) {
                    this.percent = Math.round(this.completed / this.total * 1000) / 10;
                }
                if (ended) {
                    this.currentSegment = null;
                    this.refreshFailedCount();
                    this.eventSource.close();
                    this.eventSource = null;
                }
            });

            this.eventSource.addEventListener('progress', (e) => {
                const data = JSON.parse(e.data);
                this.completed = data.completed;
                this.total = data.total;
                this.percent = data.percent;
            });

            this.eventSource.addEventListener('segment_complete', (e) => {
                const data = JSON.parse(e.data);
                this.currentSegment = null;
                this.logCounter++;
                this.logs.push({
                    id: this.logCounter,
                    type: 'success',
                    segmentId: data.segment_id,
                    text: data.translated_text,
                    model: data.model || null,
                });
                // Keep only last 50 entries
                if (this.logs.length > 50) {
                    this.logs = this.logs.slice(-50);
                }
            });

            this.eventSource.addEventListener('segment_error', (e) => {
                const data = JSON.parse(e.data);
                this.logCounter++;
                this.logs.push({
                    id: this.logCounter,
                    type: 'error',
                    segmentId: data.segment_id,
                    text: data.error,
                });
            });

            this.eventSource.addEventListener('paused', (e) => {
                // User-initiated pause state is set by the API response.
                // This handler is kept for potential multi-tab scenarios but
                // does NOT overwrite state to avoid oscillation with resume.
            });

            this.eventSource.addEventListener('rate_limit', (e) => {
                const data = JSON.parse(e.data);
                this.state = 'paused';
                this.error = (data.error || 'API 使用量已達上限') +
                    (data.resume_in ? `（${Math.round(data.resume_in)} 秒後自動繼續）` : '');
                this.autoResume = !!data.resume_in;
                this.refreshFailedCount();
            });

            this.eventSource.addEventListener('resumed', (e) => {
                // Resumed by itself after a rate limit
                this.state = 'running';
                this.autoResume = false;
                this.error = null;
            });

            this.eventSource.addEventListener('auth_error', (e) => {
                const data = JSON.parse(e.data);
                this.state = 'paused';
                this.error = data.error || {{ auth_hint|tojson }};
                this.autoResume = false;  // waits for the user
                this.refreshFailedCount();
            });

            this.eventSource.addEventListener('backend_error', (e) => {
                const data = JSON.parse(e.data);
                this.state = 'paused';
                this.autoResume = false;
                this.error = data.error;
                this.refreshFailedCount();
            });

            this.eventSource.addEventListener('stopped', (e) => {
                this.state = 'stopped';
                this.autoResume = false;
                this.currentSegment = null;
                this.refreshFailedCount();
                this.eventSource.close();
                this.eventSource = null;
            });

            this.eventSource.addEventListener('complete', (e) => {
                const data = JSON.parse(e.data);
                this.state = 'completed';
                this.autoResume = false;
                this.currentSegment = null;
                this.completed = data.total_translated;
                if (this.total > 0) {
                    this.percent = Math.round(this.completed / this.total * 1000) / 10;
                }
                this.refreshFailedCount();
                this.eventSource.close();
                this.eventSource = null;
            });

            this.eventSource.addEventListener('error', (e) => {
                if (e.data) {  // the run failed (not a dropped connection)
                    this.autoResume = false;
                    const data = JSON.parse(e.data);
                    this.error = data.error;
                    this.state = 'failed';
                    this.refreshFailedCount();
                }
                this.eventSource.close();
                this.eventSource = null;
            });

            this.eventSource.onerror = () => {
                // SSE connection error - try to reconnect after delay
                this.eventSource.close();
                this.eventSource = null;
                setTimeout(() => {
                    if (this.state === 'running' || this.state === 'paused') {
                        this.fetchStatus();
                    }
                }, 3000);
            };
        },

        destroy() {
            if (this.eventSource) {
                this.eventSource.close();
            }
        }
    };
}
</script>
{% endblock %}
